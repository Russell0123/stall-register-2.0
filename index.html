<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7a58">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="攤位收銀台">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="512x512" href="logo.png">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="logo.png">
<link rel="apple-touch-icon" href="icon.svg">
<title>攤位收銀台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    color-scheme:light;
    --bg:#f5f5f0;
    --surface:#ffffff;
    --surface-2:#f4f3ee;
    --ink:#1e2126;
    --muted:#6b7078;
    --faint:#9aa0a8;
    --line:#e4e3db;
    --line-strong:#d3d2c8;
    --accent:#0f7a58;
    --accent-on:#ffffff;
    --accent-weak:#e6efe9;
    --accent-weak:color-mix(in srgb, var(--accent) 12%, var(--surface));
    --accent-ink:#0b5a41;
    --accent-ink:color-mix(in srgb, var(--accent) 70%, var(--ink));
    --warn:#a86a15;
    --warn-weak:#f6ecd9;
    --danger:#b23b2e;
    --danger-weak:#f6e4e1;
    --shadow:0 1px 2px rgba(30,33,38,.06), 0 8px 24px -14px rgba(30,33,38,.16);
    --radius:14px;
    --ff-sans:"IBM Plex Sans","PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --ff-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }

  *{box-sizing:border-box}
  img{max-width:100%}
  [hidden]{display:none!important}
  html,body{height:100%}
  html{background:var(--bg);overflow-x:clip;overscroll-behavior-y:contain}   /* 關掉瀏覽器原生下拉刷新，改用自己的 */
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--ff-sans);font-size:15px;line-height:1.5;
    -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit;color:inherit}
  h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
  .app{max-width:860px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

  /* ---------- buttons ---------- */
  .btn{
    appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
    padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;
    transition:background .12s,border-color .12s,transform .04s;
  }
  .btn:hover{background:var(--surface-2)}
  .btn:active{transform:translateY(1px)}
  .btn--primary{background:var(--accent);border-color:var(--accent);color:var(--accent-on)}
  .btn--primary:hover{background:var(--accent);filter:brightness(.94)}
  .btn--ghost{border-color:transparent;background:transparent;color:var(--muted)}
  .btn--ghost:hover{background:var(--surface-2);color:var(--ink)}
  .btn--danger{color:var(--danger);border-color:transparent;background:transparent}
  .btn--danger:hover{background:var(--danger-weak)}
  .btn--dangerFill{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn--dangerFill:hover{filter:brightness(.94)}
  .btn--block{width:100%}
  .btn--sm{padding:7px 12px;font-size:13px;min-height:36px;border-radius:9px}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  .label{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
  .mono{font-family:var(--ff-mono);font-variant-numeric:tabular-nums}
  .money{font-family:var(--ff-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

  .empty{
    border:1px dashed var(--line-strong);border-radius:var(--radius);padding:32px 20px;text-align:center;
    color:var(--muted);background:var(--surface-2);
  }
  .empty h3{color:var(--ink);font-size:15px;margin-bottom:5px}

  /* ---------- home ---------- */
  .home{padding:0 16px 60px}
  .home-banner{
    position:relative;margin:0 -16px 4px;
    min-height:230px;
    overflow:hidden;background:var(--accent);cursor:pointer;
    display:flex;flex-direction:column
  }
  .home-banner__img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
  /* fade the picture (or the colour block) into the page background at the bottom */
  .home-banner::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:62%;z-index:1;pointer-events:none;
    background:linear-gradient(to bottom, rgba(245,245,240,0) 0%, var(--bg) 92%)
  }
  .home-banner__pal{
    position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:10px;
    width:44px;height:44px;border:0;cursor:pointer;z-index:3;padding:0;
    background:transparent;display:flex;align-items:center;justify-content:center;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,.75))
  }
  .home-banner__pal svg{width:26px;height:26px;fill:#fff;display:block}
  .home-title{
    align-self:center;text-align:center;position:relative;z-index:3;
    margin:calc(env(safe-area-inset-top) + 54px) auto 0;
    width:fit-content;min-width:6em;max-width:calc(100% - 40px);
    padding:9px 14px;border-radius:9px;
    font-size:26px;font-weight:800;line-height:1.25;letter-spacing:-.01em;color:#fff;
    text-shadow:0 1px 10px rgba(0,0,0,.45);outline:0;min-height:1.3em;
    word-break:break-word;cursor:text
  }
  .home-title:empty::before{content:attr(data-ph);opacity:.75;font-weight:700}
  .home-title:focus{background:rgba(0,0,0,.32)}
  .home-banner__hint{
    position:absolute;left:14px;bottom:14px;z-index:2;pointer-events:none;
    color:#fff;opacity:.85;font-size:12px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.4)
  }
  .home-credit{margin-top:22px;text-align:right;font-size:11px;color:var(--faint)}
  .home .tile__nm{font-size:15.5px}
  .lp-hint{font-size:11.5px;color:var(--faint);margin-bottom:10px}

  .newstall-btn{
    width:100%;min-height:62px;font-size:17px;font-weight:700;
    margin:26px 0 18px;
    box-shadow:0 4px 18px -6px rgba(0,0,0,.28)
  }

  .goto-checkout{
    position:fixed;right:16px;bottom:calc(30px + env(safe-area-inset-bottom));z-index:50;
    width:104px;height:104px;border-radius:22px;padding:0;
    flex-direction:column;gap:2px;font-size:16px;font-weight:800;line-height:1.15;
    box-shadow:0 10px 26px -6px rgba(0,0,0,.45)
  }
  .goto-checkout .ar{font-size:22px;line-height:1}

  /* ---------- tile grid (home stalls + checkout items) ---------- */
  .tile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media (min-width:600px){.tile-grid{grid-template-columns:repeat(3,1fr)}}
  .tile{
    position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;
    border:1px solid var(--line);background:var(--surface-2);cursor:pointer;
    display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--shadow);
    text-align:left;padding:0;font:inherit;color:inherit;
    /* 長按時不要跑出系統的選取／複製選單 */
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  }
  .tile__img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .tile__ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--faint)}
  .tile__cap{position:relative;background:var(--surface);border-top:1px solid var(--line);padding:9px 11px}
  .tile__nm{font-weight:650;font-size:13px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile__meta{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
  .tile__meta .mo{font-family:var(--ff-mono);color:var(--ink);font-size:13.5px;font-weight:700}
  .tile.is-out{opacity:.5;filter:grayscale(.85);pointer-events:none}
  .tile__badge{
    position:absolute;top:7px;left:7px;font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:999px;
    background:rgba(20,22,26,.62);color:#fff;backdrop-filter:blur(2px)
  }
  .tile__badge.low{background:var(--warn)}
  .tile__badge.out{background:var(--danger)}
  .tile--new{
    align-items:center;justify-content:center;gap:6px;flex-direction:column;
    border:1.5px dashed var(--line-strong);background:transparent;color:var(--muted);font-weight:650;font-size:13.5px
  }
  .tile--new span{font-size:26px;line-height:1}
  .tile--new:hover{border-color:var(--accent);color:var(--accent-ink)}

  /* ---------- stall shell ---------- */
  .stall{display:flex;flex-direction:column;flex:1;min-height:100%}
  .stall__top{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 14px 0;border-bottom:1px solid var(--line)}
  .stall__bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .stall__title{
    flex:1;min-width:0;font-size:15.5px;font-weight:700;background:transparent;border:0;cursor:pointer;
    display:flex;align-items:center;gap:7px;padding:6px 4px;border-radius:8px;text-align:left
  }
  .stall__title:hover{background:var(--surface-2)}
  .stall__title .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stall__title .pen{font-size:12px;color:var(--faint);flex-shrink:0}
  .stall__title small{display:block;font-size:10.5px;font-weight:500;color:var(--faint);overflow:hidden;text-overflow:ellipsis}
  .tabs{display:flex;gap:2px}
  .tab{
    appearance:none;border:0;background:transparent;cursor:pointer;flex:1;
    padding:11px 8px 12px;font-size:14px;font-weight:600;color:var(--muted);
    border-bottom:2px solid transparent;margin-bottom:-1px
  }
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{color:var(--accent-ink);border-color:var(--accent)}
  .tab--primary{color:var(--accent-ink);background:var(--accent-weak);border-radius:9px 9px 0 0}
  .tab--primary[aria-selected="true"]{background:var(--accent);color:var(--accent-on)}
  .stall__body{flex:1;padding:18px 14px 40px}
  /* 收銀頁：內容不夠長時，底部總金額列仍要貼齊畫面最下方 */
  .stall__body--flex{display:flex;flex-direction:column}
  .stall__body--flex .checkout-foot{margin-top:auto}

  .section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 12px}
  .section-head:first-child{margin-top:0}
  .section-head h2{font-size:15px;font-weight:700}

  /* ---------- product / bundle admin list ---------- */
  .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
  .item{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
  .thumb{
    width:54px;height:54px;border-radius:9px;flex-shrink:0;object-fit:cover;background:var(--surface-2);
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:20px
  }
  .item__body{flex:1;min-width:0}
  .item__name{font-weight:650;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item__sub{font-size:12px;color:var(--muted);margin-top:2px}
  .item__price{font-family:var(--ff-mono);font-weight:600;margin-top:4px;font-size:13.5px}
  .item__price s{color:var(--faint);font-weight:500;margin-left:5px}
  .item__actions{display:flex;flex-direction:column;gap:5px;justify-content:center}
  .chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
  .chip--low{background:var(--warn-weak);color:var(--warn);border-color:transparent}
  .chip--out{background:var(--danger-weak);color:var(--danger);border-color:transparent}
  .vlines{margin-top:7px;display:flex;flex-direction:column;gap:3px}
  .vlines div{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
  .vlines .mono{color:var(--ink)}

  /* ---------- cart ---------- */
  .cart{margin-top:18px}
  .cart__h{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
  .cart-line{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .cart-line:last-child{border-bottom:1px solid var(--line)}
  .cart-line.bad{opacity:.55}
  .cart-line__b{flex:1;min-width:0}
  .cart-line__nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cart-line__d{font-size:11.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cart-line__sub{font-family:var(--ff-mono);font-weight:600;font-size:13px;min-width:58px;text-align:right}
  .cart-line__x{border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:15px;padding:4px}
  .cart-line__x:hover{color:var(--danger)}

  .stepper{display:flex;align-items:center;gap:3px;flex-shrink:0}
  .stepper button{
    width:34px;height:34px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);
    font-size:18px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1
  }
  .stepper button:hover:not(:disabled){background:var(--surface-2)}
  .stepper button:disabled{opacity:.35;cursor:not-allowed}
  .stepper .q{min-width:30px;text-align:center;font-family:var(--ff-mono);font-weight:600;font-size:15px}

  .checkout-foot{
    position:sticky;bottom:0;z-index:15;margin:20px -14px -40px;
    padding:13px 14px calc(13px + env(safe-area-inset-bottom));
    background:var(--surface);border-top:1px solid var(--line-strong);
    display:flex;align-items:center;gap:12px;box-shadow:0 -6px 20px -16px rgba(0,0,0,.35)
  }
  .checkout-foot__s{flex:1;min-width:0}
  .checkout-foot__s .label{display:block;margin-bottom:1px;font-size:12px}
  .checkout-foot__t{font-family:var(--ff-mono);font-size:25px;font-weight:700;letter-spacing:-.02em}
  .checkout-foot__c{font-size:12.5px;color:var(--muted)}
  .checkout-foot .btn{min-height:58px;font-size:18px;font-weight:800;padding:0 24px;border-radius:13px}

  .free-toggle{
    display:flex;align-items:center;gap:11px;padding:13px 14px;border:1px solid var(--line-strong);
    border-radius:12px;background:var(--surface);cursor:pointer;margin:14px 0
  }
  .free-toggle input{width:20px;height:20px;accent-color:var(--accent);flex-shrink:0}
  .free-toggle b{font-size:14px}
  .free-toggle small{display:block;color:var(--muted);font-size:11.5px;font-weight:400;margin-top:1px}
  .free-toggle.on{border-color:var(--accent);background:var(--accent-weak)}

  .reserve-toggle{
    display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--warn-weak);
    border-radius:10px;background:var(--warn-weak);cursor:pointer;margin-top:4px;font-size:12.5px;color:var(--warn)
  }
  .reserve-toggle input{width:18px;height:18px;accent-color:var(--warn);flex-shrink:0}

  /* ---------- settle ---------- */
  .hero-income{background:var(--accent);color:var(--accent-on);border-radius:var(--radius);padding:19px 20px;margin-bottom:20px;box-shadow:var(--shadow)}
  .hero-income .label{color:var(--accent-on);opacity:.82}
  .hero-income .amt{font-family:var(--ff-mono);font-size:36px;font-weight:700;letter-spacing:-.02em;margin-top:4px;line-height:1}
  .hero-income .sub{font-size:12px;color:var(--accent-on);opacity:.86;margin-top:7px}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
  .stat__nm{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat__big{font-family:var(--ff-mono);font-size:26px;font-weight:700;letter-spacing:-.03em;margin-top:5px;line-height:1}
  .stat__big .cur{color:var(--ink)} .stat__big .sep{color:var(--faint);margin:0 3px;font-weight:400} .stat__big .ini{color:var(--faint)}
  .stat.is-out .stat__big .cur{color:var(--danger)}
  .stat__bar{position:relative;height:5px;border-radius:3px;background:var(--surface-2);margin-top:9px;overflow:visible}
  .stat__bar i{display:block;height:100%;background:var(--accent);border-radius:3px;overflow:hidden}
  .stat__resmark{position:absolute;top:-2px;bottom:-2px;width:0;border-left:2px dashed var(--warn);pointer-events:none}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 15px 17px;box-shadow:var(--shadow);margin-top:16px}
  .panel__title{font-size:14px;font-weight:700;margin-bottom:12px}
  .chart{width:100%;overflow-x:auto}
  .chart svg{display:block;min-width:420px;width:100%;height:auto}
  .ck-grid{stroke:var(--line);stroke-width:1}
  .ck-axis{fill:var(--faint);font-size:11px;font-family:var(--ff-mono)}
  .ck-name{fill:var(--muted);font-size:12px}
  .ck-val{fill:var(--ink);font-size:11px;font-family:var(--ff-mono);font-weight:600}
  .ck-sold{fill:var(--accent)} .ck-remain{fill:var(--accent-weak)}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:8px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

  .pie-wrap{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  .pie-wrap svg{flex-shrink:0}
  .pie-legs{flex:1;min-width:180px;display:flex;flex-direction:column;gap:7px}
  .pie-leg{display:flex;align-items:center;gap:8px;font-size:12.5px}
  .pie-leg i{width:11px;height:11px;border-radius:3px;flex-shrink:0}
  .pie-leg .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pie-leg .vv{font-family:var(--ff-mono);color:var(--muted);flex-shrink:0}
  .hchart{width:100%;overflow-x:auto}
  .hchart svg{display:block;height:auto}

  .filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  input[type=date],input[type=text],input[type=number],select{
    font-family:inherit;font-size:16px;padding:9px 10px;border-radius:9px;border:1px solid var(--line-strong);
    background:var(--surface);color:var(--ink);width:100%
  }
  input[type=date]{width:auto}
  .orders{display:flex;flex-direction:column;gap:8px}
  .order{border:1px solid var(--line);border-radius:11px;background:var(--surface-2);overflow:hidden}
  .order__head{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer;width:100%;background:transparent;border:0;text-align:left}
  .order__head:hover{background:var(--surface)}
  .order__time{font-size:12px;color:var(--muted);font-family:var(--ff-mono)}
  .order__cnt{font-size:11.5px;color:var(--faint);margin-left:auto}
  .order__total{font-family:var(--ff-mono);font-weight:700;font-size:14px}
  .order__total s{color:var(--faint);font-weight:400;font-size:11px;margin-right:5px}
  .free-tag{font-size:10px;font-weight:700;color:var(--accent-on);background:var(--accent);padding:2px 6px;border-radius:999px}
  .order__lines{padding:2px 12px 12px;display:none;flex-direction:column;gap:5px}
  .order.open .order__lines{display:flex}
  .order__line{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--muted)}
  .order__line b{color:var(--ink);font-weight:600}
  .order__line .lm{font-family:var(--ff-mono);color:var(--ink);flex-shrink:0}

  /* ---------- modal / sheet ---------- */
  dialog#modal{
    border:0;padding:0;border-radius:16px;max-width:520px;width:calc(100% - 28px);
    background:var(--surface);color:var(--ink);box-shadow:0 24px 70px -18px rgba(0,0,0,.5)
  }
  dialog#modal::backdrop{background:rgba(20,22,26,.5)}
  @media (max-width:560px){
    dialog#modal{width:100%;max-width:none;margin:0 0 0 0;align-self:stretch;
      position:fixed;left:0;right:0;bottom:0;top:auto;border-radius:18px 18px 0 0}
  }

<script>
"use strict";
/* ============================================================ 攤位收銀台 ============================================================ */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n=>'$'+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const pad = x=>String(x).padStart(2,'0');
const fmtDate = ts=>{const d=new Date(ts);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const fmtTime = ts=>{const d=new Date(ts);return `${fmtDate(ts)} ${pad(d.getHours())}:${pad(d.getMinutes())}`};

const THEMES = [
  {name:'松綠',hex:'#0f7a58'},{name:'翠綠',hex:'#059669'},{name:'青綠',hex:'#0d9488'},
  {name:'湖藍',hex:'#0891b2'},{name:'天藍',hex:'#0284c7'},{name:'靛藍',hex:'#2563eb'},
  {name:'藍紫',hex:'#4f46e5'},{name:'紫羅蘭',hex:'#7c3aed'},{name:'梅紅',hex:'#a21caf'},
  {name:'玫瑰',hex:'#e11d48'},{name:'磚紅',hex:'#dc2626'},{name:'焦橙',hex:'#c2410c'},
  {name:'琥珀',hex:'#b45309'},{name:'金黃',hex:'#cb9228'},{name:'橄欖',hex:'#4d7c0f'},{name:'石墨',hex:'#475569'},
  {name:'螢光綠',hex:'#7dff00'},
];

const STORE_KEY = 'stall-register-v2';
let DB = { stalls:[], settings:{ accent:THEMES[0].hex } };
let UI = { screen:'home', stallId:null, tab:'products', cart:[], stage:'catalog', free:false, openOrders:{}, dateFilter:'' };

/* ---------- persistence ---------- */
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }catch(e){} }
function load(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw){ DB=JSON.parse(raw); if(!DB.settings) DB.settings={accent:THEMES[0].hex}; if(!DB.stalls) DB.stalls=[]; return true; }
  }catch(e){}
  return false;
}
function relLum(hex){
  const n=parseInt(hex.slice(1),16), r=(n>>16&255)/255, g=(n>>8&255)/255, b=(n&255)/255;
  const f=c=>c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);
  return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b);
}
function applyTheme(){
  const hex=DB.settings.accent||THEMES[0].hex;
  const root=document.documentElement.style;
  root.setProperty('--accent',hex);
  root.setProperty('--accent-on', relLum(hex)>0.30 ? '#1e2126' : '#ffffff');
  // 手機瀏覽器 / PWA 最上方狀態列顏色 —— 更新所有 theme-color meta（沒有就補一個）
  let metas=document.querySelectorAll('meta[name="theme-color"]');
  if(!metas.length){
    const m=document.createElement('meta'); m.name='theme-color';
    (document.head||document.documentElement).appendChild(m); metas=[m];
  }
  metas.forEach(m=>m.setAttribute('content',hex));
}

/* ---------- image helpers ---------- */
function processImage(file,cb){        // centre-crop square + compress
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const size=480, c=document.createElement('canvas'); c.width=size; c.height=size;
      const s=Math.min(img.width,img.height), sx=(img.width-s)/2, sy=(img.height-s)/2;
      const ctx=c.getContext('2d');
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,size,size);
      ctx.drawImage(img, sx,sy,s,s, 0,0,size,size);
      cb(c.toDataURL('image/jpeg',0.82));
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}
function processImageWide(file,cb){    // keep aspect, cap width, compress (for banners)
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const maxW=1000, sc=Math.min(1,maxW/img.width);
      const w=Math.max(1,Math.round(img.width*sc)), h=Math.max(1,Math.round(img.height*sc));
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.82));
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}
/* mobile-safe picker: build the input on the fly and click it inside the user gesture,
   then open the drag/zoom cropper before handing back the final data URL */
function pickImage(cb,wide){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
  document.body.appendChild(inp);
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(f) openCropper(f,wide,cb); setTimeout(()=>inp.remove(),0); };
  inp.click();
}
function openCropper(file,wide,cb){
  const outW=wide?1000:480, outH=wide?Math.round(1000*6/16):480;
  const rd=new FileReader();
  rd.onload=()=>{ const img=new Image(); img.onload=()=>showCropUI(img,outW,outH,cb); img.onerror=()=>cb(rd.result); img.src=rd.result; };
  rd.readAsDataURL(file);
}
function showCropUI(img,outW,outH,cb){
  const VW=300, VH=Math.round(300*outH/outW);
  const NW=img.naturalWidth||img.width, NH=img.naturalHeight||img.height;
  const s0=Math.max(VW/NW, VH/NH);        // cover baseline
  let z=1, tx=0, ty=0, drag=null;

  const cd=document.getElementById('cropper');
  cd.innerHTML=`<div class="cropper"><div class="cropper__box">
    <div class="cropper__h">調整圖片</div>
    <div class="cropper__tip">拖曳移動位置，下方滑桿縮放</div>
    <div class="cropper__view" style="width:${VW}px;height:${VH}px">
      <img class="cropper__img" alt="" draggable="false">
    </div>
    <input type="range" class="cropper__zoom" min="1" max="3" step="0.01" value="1">
    <div class="cropper__foot">
      <button class="btn" data-cc>取消</button>
      <button class="btn btn--primary" data-co>套用</button>
    </div>
  </div></div>`;
  if(!cd.open) cd.showModal();
  const finish=()=>{ if(cd.open) cd.close(); cd.innerHTML=''; };
  const ov=cd;
  const el=cd.querySelector('.cropper__img');
  el.src=img.src;
  el.style.width=(NW*s0)+'px'; el.style.height=(NH*s0)+'px';

  function clamp(){
    const dw=NW*s0*z, dh=NH*s0*z;
    const mx=Math.max(0,(dw-VW)/2), my=Math.max(0,(dh-VH)/2);
    tx=Math.min(mx,Math.max(-mx,tx)); ty=Math.min(my,Math.max(-my,ty));
  }
  function apply(){ clamp(); el.style.transform=`translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(${z})`; }
  apply();

  const view=ov.querySelector('.cropper__view');
  view.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,tx,ty}; try{view.setPointerCapture(e.pointerId);}catch(_){} });
  view.addEventListener('pointermove',e=>{ if(!drag) return; tx=drag.tx+(e.clientX-drag.x); ty=drag.ty+(e.clientY-drag.y); apply(); });
  const endDrag=()=>{ drag=null; };
  view.addEventListener('pointerup',endDrag); view.addEventListener('pointercancel',endDrag); view.addEventListener('pointerleave',endDrag);
  ov.querySelector('.cropper__zoom').addEventListener('input',e=>{ z=parseFloat(e.target.value)||1; apply(); });

  ov.querySelector('[data-cc]').onclick=finish;
  ov.querySelector('[data-co]').onclick=()=>{
    clamp();
    const k=s0*z, dw=NW*k, dh=NH*k;
    const sw=Math.min(VW/k,NW), sh=Math.min(VH/k,NH);
    const sx=Math.max(0,Math.min((dw/2 - VW/2 - tx)/k, NW-sw));
    const sy=Math.max(0,Math.min((dh/2 - VH/2 - ty)/k, NH-sh));
    const c=document.createElement('canvas'); c.width=outW; c.height=outH;
    const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,outW,outH);
    ctx.drawImage(img, sx, sy, sw, sh, 0,0, outW,outH);
    finish();
    cb(c.toDataURL('image/jpeg',0.85));
  };
}

/* ---------- model helpers ---------- */
const stall = ()=>DB.stalls.find(s=>s.id===UI.stallId);
const product = (st,id)=>st.products.find(p=>p.id===id);
const bundle  = (st,id)=>st.bundles.find(b=>b.id===id);
const hasSpec = p=>p.specs && p.specs.length>0;
function variantByCombo(p,combo){
  const key=p.specs.map(s=>combo[s.id]).join(' / ');
  return p.variants.find(v=>v.key===key);
}
function productLocked(p){ return !!p.everSold; }
function bundleLocked(b){ return !!b.everSold; }

/* returns [{pvId, product, variant, name, detail, stock, initial, sold, img}] */
function priceUnits(st){
  const out=[];
  st.products.forEach(p=>{
    if(hasSpec(p)) p.variants.forEach(v=>out.push({pvId:v.id,product:p,variant:v,name:p.name,detail:v.key,stock:v.stock,initial:v.initialStock,sold:v.sold||0,img:v.img||p.image||''}));
    else out.push({pvId:p.id,product:p,variant:null,name:p.name,detail:'',stock:p.stock,initial:p.initialStock,sold:p.sold||0,img:p.image||''});
  });
  return out;
}
function resolvePv(st,pvId){
  for(const p of st.products){
    if(p.id===pvId) return {product:p,variant:null};
    if(hasSpec(p)){ const v=p.variants.find(x=>x.id===pvId); if(v) return {product:p,variant:v}; }
  }
  return {product:null,variant:null};
}
const pvStock = (st,pvId)=>{ const {product:p,variant:v}=resolvePv(st,pvId); return p?(v?v.stock:p.stock):0; };
const pvReserved = (st,pvId)=>{ const {product:p,variant:v}=resolvePv(st,pvId); const t=v||p; return t?(t.reserved||0):0; };
/* sellable stock for one unit: allowReserved=true also allows dipping into the reserved pool */
const pvAvail = (st,pvId,allowReserved)=>{ const s=pvStock(st,pvId); return allowReserved?s:Math.max(0,s-pvReserved(st,pvId)); };

/* stock consumed by the current cart (per pvId) */
function pvConsumed(st,pvId,exceptLineUid){
  let c=0;
  UI.cart.forEach(l=>{
    if(l.uid===exceptLineUid) return;
    if(l.kind==='product' && l.pvId===pvId) c+=l.qty;
    if(l.kind==='bundle'){
      const b=bundle(st,l.bundleId); if(!b) return;
      b.components.forEach((comp,i)=>{
        const cp=product(st,comp.productId);
        if(cp && hasSpec(cp)){
          const arr = Array.isArray(l.picks[i]) ? l.picks[i] : (l.picks[i]!=null ? [l.picks[i]] : []);
          arr.forEach(vid=>{ if(vid===pvId) c += l.qty; });
        }else if(comp.productId===pvId){ c += comp.qty*l.qty; }
      });
    }
  });
  return c;
}
const pvRemaining = (st,pvId,exceptLineUid,allowReserved)=>pvAvail(st,pvId,allowReserved)-pvConsumed(st,pvId,exceptLineUid);

/* bundle component meta at render time */
function bundleComps(st,b){
  return b.components.map(comp=>{
    const p=product(st,comp.productId);
    return {...comp, product:p, needsSpec: !!(p && hasSpec(p)), missing: !p};
  });
}
function bundleMaxBuild(st,b,picks,exceptLineUid){
  const comps=bundleComps(st,b);
  if(comps.some(c=>c.missing)) return 0;
  const demand={};   // pvId -> units consumed per one bundle
  let incomplete=false;
  comps.forEach((c,i)=>{
    if(c.needsSpec){
      const arr = picks && Array.isArray(picks[i]) ? picks[i] : null;
      if(!arr || arr.length<c.qty || arr.some(x=>!x)){ incomplete=true; return; }
      arr.forEach(vid=>{ demand[vid]=(demand[vid]||0)+1; });
    }else{
      demand[c.productId]=(demand[c.productId]||0)+c.qty;
    }
  });
  if(incomplete) return 0;
  let m=Infinity;
  for(const pv in demand){ m=Math.min(m, Math.floor(pvRemaining(st,pv,exceptLineUid)/demand[pv])); }
  return m===Infinity?0:m;
}

/* ---------- cart line resolution ---------- */
function resolveLine(st,l){
  if(l.kind==='product'){
    const {product:p,variant:v}=resolvePv(st,l.pvId);
    if(!p) return {ok:false,name:'(已刪除商品)',detail:'',unit:0,qty:l.qty,sub:0};
    return {ok:true,name:p.name,detail:v?v.key:'',unit:p.price,qty:l.qty,sub:p.price*l.qty,productId:p.id,pvId:l.pvId};
  }
  const b=bundle(st,l.bundleId);
  if(!b) return {ok:false,name:'(已刪除套組)',detail:'',unit:0,qty:l.qty,sub:0};
  const comps=bundleComps(st,b);
  const detail=comps.map((c,i)=>{
    if(c.missing) return '(缺)';
    if(c.needsSpec){
      const arr=Array.isArray(l.picks[i])?l.picks[i]:(l.picks[i]!=null?[l.picks[i]]:[]);
      const names=arr.map(vid=>{ const v=c.product.variants.find(x=>x.id===vid); return v?v.key:'未選'; });
      return `${c.product.name}（${names.join('、')||'未選'}）`;
    }
    return c.product.name+'×'+c.qty;
  }).join('、');
  const ok=comps.every((c,i)=>{
    if(c.missing) return false;
    if(!c.needsSpec) return true;
    const arr=Array.isArray(l.picks[i])?l.picks[i]:[];
    return arr.length>=c.qty && arr.every(x=>x);
  });
  return {ok,name:b.name,detail,unit:b.price,qty:l.qty,sub:b.price*l.qty,bundleId:b.id,comps,picks:l.picks};
}
function cartTotal(st){ return UI.cart.reduce((a,l)=>a+resolveLine(st,l).sub,0); }
function cartCount(st){ return UI.cart.reduce((a,l)=>a+l.qty,0); }
/* products with a reminder note that are present in the current cart (direct, or inside a bundle) */
function cartReminders(st){
  const found=new Map();
  UI.cart.forEach(l=>{
    if(l.kind==='product'){
      const {product:p}=resolvePv(st,l.pvId);
      if(p && p.reminder) found.set(p.id,{name:p.name,reminder:p.reminder});
    }else{
      const b=bundle(st,l.bundleId); if(!b) return;
      bundleComps(st,b).forEach(c=>{ if(c.product && c.product.reminder) found.set(c.product.id,{name:c.product.name,reminder:c.product.reminder}); });
    }
  });
  return [...found.values()];
}

/* ---------- payment ---------- */
/* 只「算」不「改」：產生訂單內容 + 需要扣的庫存清單（線上模式要先送伺服器驗證） */
function buildCheckout(st,free){
  const lines=[]; const need={}; let total=0;
  const addNeed=(pvId,qty,allowReserved)=>{
    if(!need[pvId]) need[pvId]={pvId,qty:0,allowReserved:false};
    need[pvId].qty+=qty;
    if(allowReserved) need[pvId].allowReserved=true;
  };
  UI.cart.forEach(l=>{
    const r=resolveLine(st,l); if(!r.ok) return;
    if(l.kind==='product'){
      const {product:p,variant:v}=resolvePv(st,l.pvId);
      const tgt=v||p;
      lines.push({kind:'product',productId:p.id,name:p.name,detail:v?v.key:'',qty:l.qty,unitPrice:p.price,lineTotal:p.price*l.qty,restore:[{pvId:tgt.id,qty:l.qty}]});
      addNeed(tgt.id,l.qty,!!l.useReserved);
      total+=p.price*l.qty;
    }else{
      const b=bundle(st,l.bundleId); const comps=bundleComps(st,b); const pids=[]; const restore=[];
      comps.forEach((c,i)=>{
        if(c.needsSpec){
          const arr=Array.isArray(l.picks[i])?l.picks[i]:[l.picks[i]];
          arr.forEach(vid=>{
            const {product:p,variant:v}=resolvePv(st,vid); const tgt=v||p;
            if(tgt){ pids.push(p.id); restore.push({pvId:tgt.id,qty:l.qty}); addNeed(tgt.id,l.qty,false); }
          });
        }else{
          const {product:p,variant:v}=resolvePv(st,c.productId); const tgt=v||p;
          if(tgt){ pids.push(p.id); restore.push({pvId:tgt.id,qty:c.qty*l.qty}); addNeed(tgt.id,c.qty*l.qty,false); }
        }
      });
      lines.push({kind:'bundle',bundleId:b.id,productIds:pids,name:b.name,detail:r.detail,qty:l.qty,unitPrice:b.price,lineTotal:b.price*l.qty,restore});
      total+=b.price*l.qty;
    }
  });
  const order={id:uid(),time:Date.now(),free:!!free,listTotal:total,total:free?0:total,lines};
  return {order,need:Object.keys(need).map(k=>need[k])};
}
/* 把一筆訂單套用到本機（扣庫存、累加收入、寫入紀錄） */
function applyOrderLocal(st,order){
  order.lines.forEach(l=>{
    (l.restore||[]).forEach(en=>{
      const {product:p,variant:v}=resolvePv(st,en.pvId); const tgt=v||p;
      if(tgt){ tgt.stock-=en.qty; tgt.sold=(tgt.sold||0)+en.qty; if(p) p.everSold=true; }
    });
    if(l.kind==='bundle'){ const b=bundle(st,l.bundleId); if(b) b.everSold=true; }
  });
  st.orders.push(order);
  st.income=(st.income||0)+(order.free?0:order.total);
  save();
}
function applyPayment(st,free){
  const {order}=buildCheckout(st,free);
  applyOrderLocal(st,order);
  return order;
}
function orderRefsProduct(st,pid){ return st.orders.some(o=>o.lines.some(l=> l.productId===pid || (l.productIds&&l.productIds.includes(pid)) )); }
function fallbackRestore(st,l){
  if(l.kind==='product'){
    const p=st.products.find(x=>x.id===l.productId); if(!p) return [];
    if(l.detail && p.variants){ const v=p.variants.find(x=>x.key===l.detail); if(v) return [{pvId:v.id,qty:l.qty}]; }
    return [{pvId:l.productId,qty:l.qty}];
  }
  return [];
}
function deleteOrder(st,oid){
  const idx=st.orders.findIndex(o=>o.id===oid); if(idx<0) return;
  const o=st.orders[idx];
  st.income=Math.max(0,(st.income||0)-(o.free?0:o.total));
  o.lines.forEach(l=>{
    (l.restore || fallbackRestore(st,l)).forEach(en=>{
      const {product:p,variant:v}=resolvePv(st,en.pvId); const tgt=v||p;
      if(tgt){ tgt.stock+=en.qty; tgt.sold=Math.max(0,(tgt.sold||0)-en.qty); }
    });
  });
  st.orders.splice(idx,1);
  st.products.forEach(p=>{ p.everSold = orderRefsProduct(st,p.id); });
  st.bundles.forEach(b=>{ b.everSold = st.orders.some(o=>o.lines.some(l=>l.bundleId===b.id)); });
  save();
}
/* wipe every order: reuses deleteOrder per-order so stock/income/locks all unwind correctly */
function clearAllOrders(st){
  st.orders.map(o=>o.id).forEach(id=>deleteOrder(st,id));
}

/* ---------- duplicate a stall: exact copy, including current stock/sold and full order history ---------- */
function duplicateStall(s){
  const copy=JSON.parse(JSON.stringify(s));
  copy.id=uid();
  copy.name=s.name+'（副本）';
  copy.createdAt=Date.now();               // 副本本身的建立時間
  copy.vendDate=s.vendDate||fmtDate(s.createdAt);   // 沿用原攤位的擺攤日期
  copy.mode='offline';                     // 副本一律是獨立的離線攤位，不會連到原本的雲端攤位
  delete copy.code; delete copy.catalogRev; delete copy.lastSync;
  delete copy.pending; delete copy.conflicts; delete copy.syncErr;
  (copy.orders||[]).forEach(o=>{ delete o.pending; });
  return copy;
}

/* ============================================================ 線上模式同步 ============================================================ */
const isOnlineStall = s => !!(s && s.mode==='online' && s.code);
const gasUrl = ()=>String(DB.settings.gasUrl||'').trim();
let syncTimer=null, syncBusy=false;

async function api(action,payload,timeoutMs){
  const url=gasUrl();
  if(!url){ const e=new Error('NO_URL'); throw e; }
  if(navigator.onLine===false) throw new Error('OFFLINE');
  const ctrl=new AbortController();
  const to=setTimeout(()=>ctrl.abort(),timeoutMs||15000);
  let res;
  try{
    res=await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},   // 用 text/plain 避開 CORS 預檢
      body:JSON.stringify(Object.assign({action},payload||{})),
      redirect:'follow',
      signal:ctrl.signal
    });
  }catch(err){ clearTimeout(to); throw new Error('OFFLINE'); }
  clearTimeout(to);
  let data=null;
  try{ data=await res.json(); }
  catch(err){ throw new Error('伺服器回應異常，請確認 Apps Script 已部署為「任何人」皆可存取'); }
  return data;
}
function apiErrText(err){
  if(!err) return '未知錯誤';
  if(err.message==='OFFLINE') return '目前連不上網路';
  if(err.message==='NO_URL') return '尚未設定 Apps Script 網址（首頁 🎨 設定裡填寫）';
  return err.message||'未知錯誤';
}

/* 要上傳到雲端的「目錄」：商品、套組與攤位基本資料（不含訂單／庫存數字） */
function catalogOf(st){
  return {name:st.name,cover:st.cover||'',vendDate:st.vendDate||'',products:st.products||[],bundles:st.bundles||[]};
}
function applyCatalog(st,cat){
  if(!cat) return;
  if(cat.name) st.name=cat.name;
  st.cover=cat.cover||'';
  if(cat.vendDate) st.vendDate=cat.vendDate;
  st.products=cat.products||[];
  st.bundles=cat.bundles||[];
}
/* 伺服器回傳的庫存／訂單是唯一真相，直接覆蓋本機 */
function applyState(st,state){
  if(!state) return;
  const stk=state.stock||{};
  priceUnits(st).forEach(u=>{
    const row=stk[u.pvId], tgt=u.variant||u.product;
    if(row&&tgt){ tgt.stock=Number(row.stock)||0; tgt.sold=Number(row.sold)||0; }
  });
  st.orders=(state.orders||[]).slice();
  st.income=st.orders.reduce((a,o)=>a+(o.free?0:(Number(o.total)||0)),0);
  st.products.forEach(p=>{ p.everSold=orderRefsProduct(st,p.id); });
  st.bundles.forEach(b=>{ b.everSold=st.orders.some(o=>o.lines.some(l=>l.bundleId===b.id)); });
  if(state.catalogRev!=null) st.catalogRev=String(state.catalogRev);
  st.lastSync=Date.now();
  st.syncErr='';
}

/* 伺服器狀態為準，但本機這兩種訂單要再疊回去，否則會被洗掉：
   1) 還沒送出去的（pending）—— 疊回並扣庫存
   2) 已收款但伺服器判定庫存不足的（conflicts）—— 只保留紀錄與收入，不動庫存 */
function applyServerSnapshot(st,state){
  applyState(st,state);
  const have={}; st.orders.forEach(o=>{ have[o.id]=1; });
  st.conflicts=(st.conflicts||[]).filter(o=>!have[o.id]);
  st.conflicts.forEach(o=>{ st.orders.push(o); });
  st.pending=(st.pending||[]).filter(j=>!have[j.order.id]);
  st.pending.forEach(j=>{ j.order.pending=true; applyOrderLocal(st,j.order); });
  st.income=st.orders.reduce((a,o)=>a+(o.free?0:(Number(o.total)||0)),0);
  st.orders.sort((a,b)=>a.time-b.time);
}
const pendingCount = s => (s&&s.pending?s.pending.length:0);
/* 本機專用的標記不要送上雲端，否則會跟著訂單存回來 */
function cleanOrder(o){ const c=Object.assign({},o); delete c.pending; delete c.conflict; return c; }

/* 一次同步循環：先把待同步的訂單補送出去，再拉最新資料 */
async function pullNow(st,opts){
  opts=opts||{};
  if(!isOnlineStall(st)||syncBusy) return false;
  syncBusy=true;
  let conflicts=[];
  try{
    /* 1) 補送離線期間累積的訂單 */
    while(pendingCount(st)){
      const job=st.pending[0];
      let d;
      try{ d=await api('checkout',{code:st.code,order:cleanOrder(job.order),need:job.need},20000); }
      catch(err){ st.syncErr=apiErrText(err); save(); if(opts.rerender) render(); if(opts.loud) toast('同步失敗：'+st.syncErr); return false; }
      if(d.ok){
        st.pending.shift();
        applyServerSnapshot(st,d.state);
      }else if(d.error==='OUT_OF_STOCK'){
        /* 貨已經交出去了，不能把訂單抹掉 —— 保留紀錄並標記成超賣讓人工處理 */
        const bad=st.pending.shift().order;
        bad.pending=false; bad.conflict=d.message||'庫存不足';
        st.conflicts=st.conflicts||[]; st.conflicts.push(bad);
        conflicts.push(`${fmtTime(bad.time)}：${d.message||'庫存不足'}`);
        if(d.state) applyServerSnapshot(st,d.state);
      }else{
        st.syncErr=d.message||d.error||'同步失敗'; save();
        if(opts.rerender) render();
        return false;
      }
    }
    /* 2) 拉最新庫存／訂單 */
    const d=await api('pull',{code:st.code,have:st.catalogRev||''});
    if(!d.ok) throw new Error(d.message||d.error||'同步失敗');
    if(d.catalog) applyCatalog(st,d.catalog);
    applyServerSnapshot(st,d.state);
    st.syncErr=''; save();
    if(opts.rerender) render();
    if(conflicts.length){
      alertDialog('有訂單與雲端庫存衝突',
        '下列已收款的訂單，送到伺服器時庫存已經不足（其他裝置先賣掉了）：\n\n'+conflicts.join('\n')+
        '\n\n這些訂單仍保留在紀錄中並標示為「超賣」，雲端庫存不會再扣，請自行處理出貨。');
    }
    return true;
  }catch(err){
    st.syncErr=apiErrText(err); save();
    if(opts.rerender) render();
    if(opts.loud) toast('同步失敗：'+st.syncErr);
    return false;
  }finally{ syncBusy=false; }
}

/* 商品／套組／攤位資料有變動時，把目錄推上雲端；stockSet 是使用者這次明確改過的庫存 */
async function pushCatalog(st,stockSet){
  if(!isOnlineStall(st)) return true;
  try{
    const d=await api('pushCatalog',{code:st.code,catalog:catalogOf(st),stockSet:stockSet||null});
    if(!d.ok) throw new Error(d.message||d.error||'同步失敗');
    if(d.catalogRev) st.catalogRev=String(d.catalogRev);
    applyState(st,d.state); save(); render();
    return true;
  }catch(err){
    st.syncErr=apiErrText(err); save(); render();
    toast(err.message==='OFFLINE'
      ? '沒有網路，這次修改只存在這台裝置；連上網後請再存一次以同步'
      : ('同步失敗：'+st.syncErr));
    return false;
  }
}

function startSync(){
  stopSync();
  if(!isOnlineStall(stall())) return;
  syncTimer=setInterval(()=>{
    const s=stall();
    if(!isOnlineStall(s)) return stopSync();
    if(modal.open) return;                                   // 有表單開著先不要抽換資料
    if(document.querySelector('.pop-dim,.fs-page')) return;
    if(UI.tab==='checkout'&&UI.stage==='confirm') return;     // 確認收款頁面不打斷
    pullNow(s,{rerender:true});

}
function stopSync(){ if(syncTimer){ clearInterval(syncTimer); syncTimer=null; } }

/* 永久轉為離線模式（單向） */
function convertToOffline(st){
  st.mode='offline';
  delete st.code; delete st.catalogRev; delete st.syncErr;
  /* 待同步的訂單早就已經記在本機了，轉離線後不用再送，清掉佇列與標記 */
  st.orders.forEach(o=>{ delete o.pending; });

  stopSync(); save(); render();

/* ---------- 下拉重新同步（取代瀏覽器原生的下拉刷新） ---------- */
let ptrEl=null, ptrStartY=0, ptrDist=0, ptrOn=false;
function ptrNode(){
  if(!ptrEl){ ptrEl=document.createElement('div'); ptrEl.className='ptr'; ptrEl.innerHTML='<i>↓</i>'; document.body.appendChild(ptrEl); }
  return ptrEl;
}
function ptrMove(d){
  const el=ptrNode();
  el.classList.remove('spin');
  el.querySelector('i').textContent = d>60?'↻':'↓';
  el.style.transform=`translate(-50%,${Math.min(d,100)-46}px)`;
}
function ptrHide(){ if(ptrEl){ ptrEl.classList.remove('spin'); ptrEl.style.transform='translate(-50%,-46px)'; } }
function ptrSpin(){ const el=ptrNode(); el.classList.add('spin'); el.querySelector('i').textContent='↻'; el.style.transform='translate(-50%,18px)'; }
function initPullToRefresh(){
  document.addEventListener('touchstart',e=>{
    ptrOn=false; ptrDist=0;
    if(e.touches.length!==1) return;
    if(window.scrollY>3) return;
    if(modal.open||document.querySelector('.pop-dim,.fs-page')) return;
    if(!isOnlineStall(stall())) return;
    ptrStartY=e.touches[0].clientY; ptrOn=true;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!ptrOn) return;
    const dy=e.touches[0].clientY-ptrStartY;
    if(dy<=0||window.scrollY>3){ ptrOn=false; ptrDist=0; ptrHide(); return; }
    ptrDist=dy;
    if(dy>8) e.preventDefault();          // 吃掉這個手勢，避免跟頁面捲動打架
    ptrMove(dy);
  },{passive:false});
  const end=()=>{
    if(!ptrOn) return;
    const d=ptrDist; ptrOn=false; ptrDist=0;
    if(d>60){
      const s=stall();
      if(isOnlineStall(s)){ ptrSpin(); pullNow(s,{rerender:true,loud:true}).then(()=>setTimeout(ptrHide,250)); return; }
    }
    ptrHide();
  };
  document.addEventListener('touchend',end);
  document.addEventListener('touchcancel',end);
}

const reduceMotion = ()=>window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
const ANIMS=['anim-in-right','anim-out-right','anim-in-left','anim-up'];
function animOnce(el,cls){ ANIMS.forEach(c=>el.classList.remove(c)); void el.offsetWidth; el.classList.add(cls); el.addEventListener('animationend',()=>el.classList.remove(cls),{once:true}); }
/* forward nav: new screen slides in from the right */

}

/* ---------- 收銀頁的簡易計算機（右側滑入／滑出） ---------- */
let calcEl=null, calcCur='0', calcAcc=null, calcOp=null, calcFresh=true;
const buzz = ()=>{ try{ if(navigator.vibrate) navigator.vibrate(9); }catch(_){} };
function calcCompute(a,b,op){
  if(op==='+') return a+b;
  if(op==='-') return a-b;
  if(op==='×') return a*b;
  if(op==='÷') return b===0?NaN:a/b;
  return b;
}
function calcFmt(n){
  if(!isFinite(n)) return '錯誤';
  return String(Math.round(n*1e8)/1e8);
}
function calcDraw(){
  if(!calcEl) return;
  calcEl.querySelector('.calc-disp__cur').textContent=calcCur;
  calcEl.querySelector('.calc-disp__prev').textContent=(calcAcc!==null&&calcOp)?`${calcFmt(calcAcc)} ${calcOp}`:'';
}
function calcPress(k){
  buzz();
  if(k==='AC'){ calcCur='0'; calcAcc=null; calcOp=null; calcFresh=true; }
  else if(k==='⌫'){ if(!calcFresh){ calcCur=calcCur.slice(0,-1)||'0'; if(calcCur==='-') calcCur='0'; } }
  else if(k==='.'){ if(calcFresh){ calcCur='0.'; calcFresh=false; } else if(calcCur.indexOf('.')<0) calcCur+='.'; }
  else if('0123456789'.indexOf(k)>=0){
    if(calcFresh){ calcCur=k; calcFresh=false; }
    else if(calcCur.length<14) calcCur=(calcCur==='0'?k:calcCur+k);
  }
  else if(k==='='){
    if(calcOp!==null&&calcAcc!==null){ calcCur=calcFmt(calcCompute(calcAcc,parseFloat(calcCur)||0,calcOp)); calcAcc=null; calcOp=null; }
    calcFresh=true;
  }
  else{ /* + - × ÷ */
    if(calcOp!==null&&calcAcc!==null&&!calcFresh){ calcCur=calcFmt(calcCompute(calcAcc,parseFloat(calcCur)||0,calcOp)); }
    calcAcc=parseFloat(calcCur)||0; calcOp=k; calcFresh=true;
  }
  calcDraw();
}
const CALC_KEYS=[
  ['AC','fn w2'],['⌫','fn'],['÷','op'],
  ['7',''],['8',''],['9',''],['×','op'],
  ['4',''],['5',''],['6',''],['-','op'],
  ['1',''],['2',''],['3',''],['+','op'],
  ['0','w2'],['.',''],['=','eq']
];
function ensureCalc(show){
  if(!show){ if(calcEl){ calcEl.remove(); calcEl=null; } return; }
  if(calcEl) return;                      // 已經在畫面上就別重建，狀態與展開與否才不會被洗掉
  calcEl=document.createElement('div');
  calcEl.className='calc-wrap';
  calcEl.innerHTML=`
    <button class="calc-handle" aria-label="計算機">❮</button>
    <div class="calc-body">
      <div class="calc-disp"><div class="calc-disp__prev"></div><div class="calc-disp__cur">0</div></div>
      <div class="calc-keys">
        ${CALC_KEYS.map(([k,c])=>`<button class="calc-key ${c}" data-k="${esc(k)}">${k==='-'?'−':esc(k)}</button>`).join('')}
      </div>
    </div>`;
  document.body.appendChild(calcEl);
  const handle=calcEl.querySelector('.calc-handle');
  handle.onclick=()=>{
    buzz();
    calcEl.classList.toggle('open');
    handle.textContent=calcEl.classList.contains('open')?'❯':'❮';
  };
  calcEl.querySelectorAll('[data-k]').forEach(b=>{ b.onclick=()=>calcPress(b.dataset.k); });
  calcDraw();
}

function renderCheckout(st,body){

    const remAll=hasSpec(p)?p.variants.reduce((a,v)=>a+pvRemaining(st,v.id,null,true),0):pvRemaining(st,p.id,null,true);
    const out=remAll<=0;
    const reserveOnly=!out&&remNo<=0;
    const badge=out?'售罄':reserveOnly?`僅預留 ${remAll}`:`庫存 ${remNo}`;

        <span class="tile__meta"><span class="mo">${money(p.price)}</span>${hasSpec(p)?'<span>可選規格</span>':''}</span></span>
    </button>`;}).join('');

  const btiles=st.bundles.map(b=>{

    const out=comps.some(c=>c.missing) || (!specNeeded && mx<=0);
    return `<button class="tile ${out?'is-out':''}" data-act="pick-bundle" data-id="${b.id}">
      ${b.image?`<img class="tile__img" src="${b.image}" alt="">`:`<span class="tile__ph">🎁</span>`}
      <span class="tile__badge ${out?'out':''}">${comps.some(c=>c.missing)?'商品不足':specNeeded?'選規格':(mx<=0?'售罄':'可組 '+mx)}</span>
      <span class="tile__cap"><span class="tile__nm">${esc(b.name)}</span>

  const total=cartTotal(st), count=cartCount(st);

      ${UI.cart.length?UI.cart.map(l=>cartLineRow(st,l)).join(''):`<div class="empty" style="padding:20px">點上方商品加入購物車</div>`}

      <div class="checkout-foot__s"><span class="label">本次總金額</span>

function niceMax(v){ if(v<=0)return 10; const m=Math.pow(10,Math.floor(Math.log10(v))); const n=v/m; const s=n<=1?1:n<=2?2:n<=5?5:10; return s*m; }

        sold:p.variants.reduce((a,v)=>a+(v.sold||0),0)};

      <div class="stat__bar"><i style="width:${pct}%"></i>${d.reserved>0?`<span class="stat__resmark" style="left:${resPct}%"></span>`:''}</div>
    </div>`;}).join('');

  const orders=st.orders.slice().sort((a,b)=>b.time-a.time);

      </div>
    </div>`).join('') : `<div class="empty" style="padding:20px">尚無訂單紀錄</div>`;

  const totalSold=per.reduce((a,d)=>a+d.sold,0);

    </div>
    <div class="section-head"><h2>庫存</h2></div>

      <div class="panel__title" style="display:flex;align-items:center;gap:8px">

function openIncomeDetail(st){
  const rev={};
  st.orders.forEach(o=>{
    if(o.free) return;
    o.lines.forEach(l=>{
      const key = l.kind==='bundle' ? 'b:'+(l.bundleId||l.name) : 'p:'+(l.productId||l.name);
      if(!rev[key]) rev[key]={name:l.name,amount:0};
      rev[key].amount += l.lineTotal||0;
    });
  });
  const revArr=Object.values(rev).filter(r=>r.amount>0).sort((a,b)=>b.amount-a.amount);
  const revTotal=revArr.reduce((a,r)=>a+r.amount,0);
  const units=priceUnits(st)
    .map(u=>({name:u.name+(u.detail?`（${u.detail}）`:''), sold:u.sold||0}))
    .filter(u=>u.sold>0).sort((a,b)=>b.sold-a.sold);

  const ov=document.createElement('div');
  ov.className='fs-page anim-in-right';
  ov.innerHTML=`
    <div class="fs-page__top">
      <button class="btn btn--ghost btn--sm" id="fsBack">← 返回</button>
      <h2>收入明細</h2>
    </div>
    <div class="fs-page__body">
      <div class="hero-income" style="cursor:default">
        <span class="label">目前收入總金額</span>
        <div class="amt">${money(st.income)}</div>
      </div>
      <div class="panel">
        <div class="panel__title">收入來源（商品 / 套組）</div>
        ${revArr.length?pieSVG(revArr,revTotal):`<div class="empty" style="padding:20px">尚無收入</div>`}
      </div>
      <div class="panel">
        <div class="panel__title">各品項銷量（含不同規格；套組售出併入商品）</div>
        ${units.length?barSVG(units):`<div class="empty" style="padding:20px">尚無銷售</div>`}
      </div>
    </div>`;
  document.body.appendChild(ov);
  let closed=false;
  const close=()=>{
    if(closed) return; closed=true;
    if(reduceMotion()){ ov.remove(); return; }
    ov.classList.remove('anim-in-right'); ov.classList.add('anim-out-right');
    const kill=()=>ov.remove();
    ov.addEventListener('animationend',kill,{once:true});
    setTimeout(kill,360);
  };
  ov.querySelector('#fsBack').onclick=close;
}

/* finish the sale.
   離線攤位：直接在本機扣庫存寫訂單。
   線上攤位：一定即時打伺服器驗證（LockService 保護），成功才更新本機；失敗保留購物車。*/
function completeCheckout(st){
  const {order,need}=buildCheckout(st,UI.free);
  if(!order.lines.length) return;
  /* 一律先在本機成交：畫面立刻回應，不等網路 */
  if(isOnlineStall(st)){
    order.pending=true;
    st.pending=st.pending||[];
    st.pending.push({order,need});
  }
  applyOrderLocal(st,order);
  UI.cart=[]; UI.stage='catalog'; UI.free=false;
  render(); bigCheck();
  /* 再背景送出；失敗就留在佇列裡，靠小浮動提示 + 下次同步補送 */
  if(isOnlineStall(st)) setTimeout(()=>pullNow(st,{rerender:true}),60);
}

const CHART_PAL=['#0f7a58','#2563eb','#c2410c','#7c3aed','#0891b2','#dc2626','#b45309','#4d7c0f','#9aa0a8'];
function pieSVG(items,total){
  let arr=items;
  if(items.length>8){
    const rest=items.slice(7).reduce((a,r)=>a+r.amount,0);
    arr=[...items.slice(0,7),{name:'其他',amount:rest}];
  }
  const cx=90,cy=90,r=82;
  let ang=-Math.PI/2;
  const segs=arr.map((it,i)=>{
    const frac=total>0?it.amount/total:0;
    if(frac<=0) return '';
    if(frac>=0.9999) return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${CHART_PAL[i%CHART_PAL.length]}"/>`;
    const a2=ang+frac*Math.PI*2, large=frac>0.5?1:0;
    const x1=cx+r*Math.cos(ang), y1=cy+r*Math.sin(ang);
    const x2=cx+r*Math.cos(a2), y2=cy+r*Math.sin(a2);
    ang=a2;
    return `<path d="M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${CHART_PAL[i%CHART_PAL.length]}" stroke="var(--surface)" stroke-width="2"/>`;
  }).join('');
  const legend=arr.map((it,i)=>`<div class="pie-leg"><i style="background:${CHART_PAL[i%CHART_PAL.length]}"></i><span class="nm">${esc(it.name)}</span><span class="vv">${money(it.amount)} · ${total>0?Math.round(it.amount/total*100):0}%</span></div>`).join('');
  return `<div class="pie-wrap"><svg viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="收入來源圓餅圖">${segs}</svg><div class="pie-legs">${legend}</div></div>`;
}
function barSVG(units){
  const max=niceMax(Math.max(...units.map(u=>u.sold)));
  const n=units.length, bw=42, gap=20, padL=36, padR=14, padT=12, padB=64, H=214;
  const W=padL+padR+n*bw+(n-1)*gap;
  const plotH=H-padT-padB;
  const y=v=>padT+plotH-(v/max)*plotH;
  const ticks=[]; for(let i=0;i<=4;i++) ticks.push(max/4*i);
  const grid=ticks.map(t=>`<line class="ck-grid" x1="${padL}" y1="${y(t).toFixed(1)}" x2="${W-padR}" y2="${y(t).toFixed(1)}"/><text class="ck-axis" x="${padL-6}" y="${(y(t)+3).toFixed(1)}" text-anchor="end">${Math.round(t)}</text>`).join('');
  const bars=units.map((u,i)=>{
    const bx=padL+i*(bw+gap), bh=Math.max(0,(u.sold/max)*plotH), by=padT+plotH-bh;
    const lab=u.name.length>7?u.name.slice(0,7)+'…':u.name;
    return `<g>
      <rect class="ck-sold" x="${bx}" y="${by.toFixed(1)}" width="${bw}" height="${bh.toFixed(1)}" rx="4"/>
      <text class="ck-val" x="${bx+bw/2}" y="${(by-5).toFixed(1)}" text-anchor="middle">${u.sold}</text>
      <text class="ck-name" x="${bx+bw/2}" y="${H-padB+16}" text-anchor="end" transform="rotate(-38 ${bx+bw/2} ${H-padB+16})">${esc(lab)}</text>
    </g>`;}).join('');
  return `<div class="hchart"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="各品項銷量長條圖">${grid}${bars}</svg></div>`;
}

/* ============================================================ EVENTS ============================================================ */
app.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const act=t.dataset.act, id=t.dataset.id, st=stall();

  if(act==='new-stall') return openStallModal(null);
  if(act==='settings') return openSettings();
  if(act==='edit-banner'){
    if(e.target.closest('#homeTitle')) return;   // 點在標題上是編輯文字，不換圖
    return pickImage(d=>{ DB.settings.homeBanner=d; save(); render(); }, true);
  }
  if(act==='open-stall'){
    if(lpFired){ lpFired=false; return; }   // this click is the tail end of a long-press, not a tap
    goForward(()=>{ UI.stallId=id;UI.screen='stall';UI.tab=defaultTabFor(DB.stalls.find(x=>x.id===id));UI.cart=[];UI.stage='catalog';UI.free=false;UI.openOrders={};UI.dateFilter=''; });
    const s=stall();
    if(isOnlineStall(s)){ startSync(); pullNow(s,{rerender:true}); }
    return;
  }
  if(act==='back'){ stopSync(); return goBack(()=>{ save(); UI.screen='home';UI.stallId=null;UI.cart=[];UI.stage='catalog'; }); }
  if(act==='edit-stall') return openStallModal(st);
  if(act==='sync-now'){ toast('同步中…'); await pullNow(st,{rerender:true,loud:true}); if(!st.syncErr) toast('已更新為最新資料'); return; }
  if(act==='tab'){
    UI.tab=id; UI.stage='catalog'; render();
    if(id==='settle' && isOnlineStall(st)) pullNow(st,{rerender:true});   // 進結算頁立即拉一次
    return;
  }
  if(act==='income-detail') return openIncomeDetail(st);
  if(act==='stock-detail'){ const p=product(st,id); if(p) openStockPopup(p); return; }

  if(act==='add-product') return openProductModal(st,null);
  if(act==='edit-product') return openProductModal(st,product(st,id));
  if(act==='del-product'){
    const p=product(st,id);
    if(await confirmDialog(`確定要刪除商品「${p.name}」？此動作無法復原（既有訂單紀錄不受影響）。`)){
      st.products=st.products.filter(x=>x.id!==id); save(); render();
      if(isOnlineStall(st)) pushCatalog(st);
    }
    return;
  }
  if(act==='add-bundle') return openBundleModal(st,null);
  if(act==='edit-bundle') return openBundleModal(st,bundle(st,id));
  if(act==='del-bundle'){
    const b=bundle(st,id);
    if(await confirmDialog(`確定要刪除套組「${b.name}」？此動作無法復原。`)){
      st.bundles=st.bundles.filter(x=>x.id!==id); save(); render();
      if(isOnlineStall(st)) pushCatalog(st);
    }
    return;
  }

  if(act==='pick-product') return openAddSheet(st,'product',id);
  if(act==='pick-bundle') return openAddSheet(st,'bundle',id);
  if(act==='line-inc'||act==='line-dec'){
    const l=UI.cart.find(x=>x.uid===t.dataset.uid); if(!l) return;
    if(act==='line-inc'){
      const ok = l.kind==='product' ? pvRemaining(st,l.pvId,l.uid,l.useReserved)>=l.qty+1
                                    : bundleMaxBuild(st,bundle(st,l.bundleId),l.picks,l.uid)>=l.qty+1;
      if(ok) l.qty++;
    }else{ l.qty--; if(l.qty<=0) UI.cart=UI.cart.filter(x=>x.uid!==l.uid); }
    renderCheckout(st,$('#body')); return;
  }
  if(act==='line-del'){ UI.cart=UI.cart.filter(x=>x.uid!==t.dataset.uid); renderCheckout(st,$('#body')); return; }
  if(act==='go-confirm'){
    UI.stage='confirm'; renderCheckout(st,$('#body'));
    if(!reduceMotion()){ const b=$('#body'); if(b) animOnce(b,'anim-up'); }
    return;
  }
  if(act==='back-catalog'){ UI.stage='catalog'; return renderCheckout(st,$('#body')); }
  if(act==='toggle-free'){ UI.free = (typeof t.checked==='boolean') ? t.checked : !UI.free; return renderCheckout(st,$('#body')); }
  if(act==='confirm-pay'){
    if(!UI.cart.length) return;
    const reminders=cartReminders(st);
    if(reminders.length){ openReminderPopup(reminders,()=>completeCheckout(st)); return; }
    completeCheckout(st);
    return;
  }

  if(act==='toggle-order'){ UI.openOrders[id]=!UI.openOrders[id]; t.closest('.order').classList.toggle('open'); return; }
  if(act==='del-order'){
    const o=st.orders.find(x=>x.id===id); if(!o) return;
    const cnt=o.lines.reduce((a,l)=>a+l.qty,0);
    const msg=o.free
      ? `刪除這筆贈送訂單？庫存會加回 ${cnt} 件，收入不變。`
      : `刪除這筆訂單？收入會扣回 ${money(o.total)}，庫存會加回 ${cnt} 件。此動作無法復原。`;
    if(!await confirmDialog(msg,'刪除訂單')) return;
    if(isOnlineStall(st)){
      try{
        const d=await api('delOrder',{code:st.code,orderId:id});
        if(!d.ok){ if(d.state){applyState(st,d.state);save();render();} return alertDialog('刪除失敗',d.message||d.error||''); }
        applyState(st,d.state); save(); render(); toast('已刪除訂單（已同步到雲端）');
      }catch(err){ await alertDialog('刪除失敗',apiErrText(err)+'\n\n線上攤位的訂單需要連線才能刪除。'); }
      return;
    }
    deleteOrder(st,id); render(); toast('已刪除訂單，收入與庫存已還原');
    return;
  }
  if(act==='clear-orders'){
    if(!st.orders.length) return;
    const n=st.orders.length;
    if(!await confirmDialog(`確定要清除全部 ${n} 筆訂單紀錄嗎？收入會歸零，已售出的庫存與銷量會全部還原，商品規格鎖定也會解除。此動作無法復原。`,'清除全部訂單')) return;
    if(isOnlineStall(st)){
      try{
        const d=await api('clearOrders',{code:st.code},25000);
        if(!d.ok) return alertDialog('清除失敗',d.message||d.error||'');
        applyState(st,d.state); save(); render(); toast('已清除所有訂單（已同步到雲端）');
      }catch(err){ await alertDialog('清除失敗',apiErrText(err)+'\n\n線上攤位需要連線才能清除訂單。'); }
      return;
    }
    clearAllOrders(st); render(); toast('已清除所有訂單紀錄，庫存與收入已還原');
    return;
  }
});
app.addEventListener('keydown',e=>{

  const el=e.target.closest('[role="button"][data-act]');

/* ============================================================ MODALS ============================================================ */
const modal=$('#modal');
function closeModal(){ if(modal.open) modal.close(); modal.innerHTML=''; }
modal.addEventListener('click',e=>{ if(e.target===modal) closeModal(); });
function shell(title,bodyHtml,footHtml){
  modal.innerHTML=`<div class="m-head"><h3>${esc(title)}</h3><button class="btn btn--ghost btn--sm" data-x aria-label="關閉">✕</button></div>
    <div class="m-body">${bodyHtml}</div><div class="m-foot">${footHtml}</div>`;
  $$('[data-x]',modal).forEach(el=>el.onclick=closeModal);
  if(!modal.open) modal.showModal();
}
function confirmDialog(msg,okLabel='確認刪除',tone='danger'){
  return new Promise(resolve=>{
    let done=false; const fin=v=>{ if(done)return; done=true; resolve(v); closeModal(); };
    shell('請確認',`<p class="confirm-msg">${esc(msg)}</p>`,
      `<button class="btn" id="cfNo">取消</button><button class="btn ${tone==='danger'?'btn--dangerFill':'btn--primary'}" id="cfYes">${esc(okLabel)}</button>`);
    $('#cfNo',modal).onclick=()=>fin(false);
    $('#cfYes',modal).onclick=()=>fin(true);
    $('[data-x]',modal).onclick=()=>fin(false);
    modal.addEventListener('close',()=>fin(false),{once:true});
  });
}
function alertDialog(title,msg){
  return new Promise(resolve=>{
    let done=false; const fin=()=>{ if(done)return; done=true; resolve(); closeModal(); };
    shell(title,`<p class="confirm-msg">${esc(msg)}</p>`,`<button class="btn btn--primary" id="akOk">知道了</button>`);
    $('#akOk',modal).onclick=fin;
    $('[data-x]',modal).onclick=fin;
    modal.addEventListener('close',fin,{once:true});
  });
}
