/* ----- stall create / edit ----- */
function openStallModal(existing){
  const draft = existing
    ? {id:existing.id,name:existing.name,cover:existing.cover||'',vendDate:existing.vendDate||fmtDate(existing.createdAt)}
    : {id:uid(),name:'',cover:'',vendDate:fmtDate(Date.now())};
  let mode = existing ? (existing.mode||'offline') : 'offline';   // offline | online-new | online-join
  const online = existing && isOnlineStall(existing);

  const MODE_DESC={
    'offline':'只存在這台裝置，完全不需要網路。<br>建立後無法改成線上模式。',
    'online-new':'產生一組 4 碼代碼，共用庫存與訂單。<br>其他手機輸入代碼即可加入。',
    'online-join':'輸入別人給的 4 碼代碼，把雲端上的<br>商品、庫存與訂單同步到這台裝置。'
  };
  function modeBlock(){
    if(existing) return '';
    return `<div class="field"><label>攤位模式</label>
      <div class="mode-pick">
        <button type="button" class="mode-opt ${mode==='offline'?'on':''}" data-mode="offline">
          <i>💾</i><b>離線模式</b></button>
        <button type="button" class="mode-opt ${mode==='online-new'?'on':''}" data-mode="online-new">
          <i>☁️</i><b>線上<br>新攤位</b></button>
        <button type="button" class="mode-opt ${mode==='online-join'?'on':''}" data-mode="online-join">
          <i>🔗</i><b>線上<br>加入</b></button>
      </div>
      <div class="mode-desc">${MODE_DESC[mode]||''}</div>
      ${mode==='online-join'?`<div style="margin-top:10px"><input type="text" id="sjoin" maxlength="4" placeholder="輸入 4 碼代碼" style="text-transform:uppercase;letter-spacing:.3em;font-family:var(--ff-mono);font-size:20px;text-align:center"></div>`:''}
    </div>`;
  }
  function bodyHtml(){
    const joinMode = !existing && mode==='online-join';
    return `<div class="${existing?'':'create-fixed'}">${modeBlock()}
      ${joinMode?'':`<div class="field"><label>攤位名稱</label><input type="text" id="snm" value="${esc(draft.name)}" placeholder="例如：夜市手作飾品攤" maxlength="40"></div>
      <div class="field"><label>擺攤日期</label><input type="date" id="svdate" value="${draft.vendDate}"></div>
      <div class="field"><label>封面圖（選填）</label>
        <button type="button" class="img-drop" id="scovBtn">
          ${draft.cover?`<img src="${draft.cover}" alt="">`:`<span class="ph">🏪</span>`}
          <span>${draft.cover?'點擊更換封面':'點擊選擇封面圖'}</span>
        </button>
      </div>`}
      ${online?`<div class="field"><label>線上同步</label>
        <div class="online-box">
          <div>攤位代碼　<b class="code-badge">${esc(existing.code)}</b></div>
          <div class="hint" style="margin-top:6px">其他裝置在「建立新攤位 → 線上模式 · 加入既有攤位」輸入這組代碼即可共用這個攤位。</div>
          <button class="btn btn--danger btn--sm" id="toOffline" style="margin-top:10px">永久轉為離線模式</button>
        </div>
      </div>`:''}
      <div class="err" id="serr"></div></div>`;
  }
  shell(existing?'編輯攤位':'建立新攤位',bodyHtml(),
    `<button class="btn" data-x2>取消</button><button class="btn btn--primary" id="ssave">${existing?'儲存':'建立'}</button>`);
  $('[data-x2]',modal).onclick=closeModal;

  function grab(){
    const n=$('#snm',modal), v=$('#svdate',modal);
    if(n) draft.name=n.value;
    if(v) draft.vendDate=v.value;
  }
  function wire(){
    $$('.mode-opt',modal).forEach(b=>b.onclick=()=>{ grab(); mode=b.dataset.mode; $('.m-body',modal).innerHTML=bodyHtml(); wire(); });
    const n=$('#snm',modal); if(n) n.focus();
    const cb=$('#scovBtn',modal);
    if(cb) cb.onclick=()=>pickImage(d=>{ grab(); draft.cover=d; $('.m-body',modal).innerHTML=bodyHtml(); wire(); });
    const off=$('#toOffline',modal);
    if(off) off.onclick=async()=>{ closeModal(); await askConvertOffline(existing); };
  }
  wire();

  const err=m=>{ const er=$('#serr',modal); er.textContent=m; er.classList.add('show'); };
  const busy=on=>{ const b=$('#ssave',modal); if(b){ b.disabled=on; b.textContent=on?'處理中…':(existing?'儲存':'建立'); } };
  const enterStall=id=>goForward(()=>{ UI.stallId=id;UI.screen='stall';UI.tab=defaultTabFor(DB.stalls.find(x=>x.id===id));UI.cart=[];UI.stage='catalog';UI.free=false;UI.openOrders={};UI.dateFilter=''; });

  $('#ssave',modal).onclick=async()=>{
    /* --- 加入既有線上攤位 --- */
    if(!existing && mode==='online-join'){
      const code=String(($('#sjoin',modal)||{}).value||'').trim().toUpperCase();
      if(code.length!==4) return err('請輸入 4 碼攤位代碼');
      if(!gasUrl()) return err('尚未設定 Apps Script 網址');
      busy(true);
      try{
        const d=await api('join',{code});
        if(!d.ok) { busy(false); return err(d.message||d.error||'加入失敗'); }
        const st={id:uid(),name:(d.catalog&&d.catalog.name)||('攤位 '+code),createdAt:Date.now(),
          vendDate:(d.catalog&&d.catalog.vendDate)||fmtDate(Date.now()),cover:'',
          products:[],bundles:[],orders:[],income:0,mode:'online',code:d.code||code};
        applyCatalog(st,d.catalog); applyState(st,d.state);
        DB.stalls.push(st); save(); closeModal(); enterStall(st.id); startSync();
        toast(`已加入攤位「${st.name}」`);
      }catch(e2){ busy(false); return err(apiErrText(e2)); }
      return;
    }

    const name=$('#snm',modal).value.trim();
    const vendDate=$('#svdate',modal).value || fmtDate(Date.now());
    if(!name) return err('請輸入攤位名稱');

    /* --- 編輯既有攤位 --- */
    if(existing){
      existing.name=name; existing.cover=draft.cover; existing.vendDate=vendDate;
      save(); closeModal(); render();
      if(isOnlineStall(existing)) pushCatalog(existing);
      return;
    }

    /* --- 建立新攤位 --- */
    const st={id:draft.id,name,createdAt:Date.now(),vendDate,cover:draft.cover,
      products:[],bundles:[],orders:[],income:0,mode:mode==='offline'?'offline':'online'};
    if(mode==='online-new'){
      if(!gasUrl()) return err('尚未設定 Apps Script 網址');
      busy(true);
      try{
        const d=await api('create',{stallId:st.id,catalog:catalogOf(st)});
        if(!d.ok){ busy(false); return err(d.message||d.error||'建立失敗'); }
        st.code=d.code; applyState(st,d.state);
      }catch(e2){ busy(false); return err(apiErrText(e2)); }
    }
    DB.stalls.push(st); save(); closeModal(); enterStall(st.id);
    if(isOnlineStall(st)){ startSync(); showCodeSplash(st.code); }
  };
}

/* ----- product create / edit ----- */
function openProductModal(st,existing){
  const locked = existing && productLocked(existing);
  const draft = existing ? JSON.parse(JSON.stringify(existing))
    : {id:uid(),name:'',image:'',price:0,specs:[],stock:0,initialStock:0,reserved:0,sold:0,variants:[]};
  draft.specs=draft.specs||[]; draft.variants=draft.variants||[];

  function buildVariants(){
    if(!draft.specs.length){ draft.variants=[]; return; }
    let combos=[{}];
    draft.specs.forEach(s=>{
      const opts=(s.options&&s.options.length)?s.options:['—']; const next=[];
      opts.forEach(o=>combos.forEach(c=>next.push({...c,[s.id]:o}))); combos=next;
    });
    draft.variants=combos.map(combo=>{
      const key=draft.specs.map(s=>combo[s.id]).join(' / ');
      const ex=draft.variants.find(v=>v.key===key);
      return ex?{...ex,combo,key}:{id:uid(),key,combo,stock:0,initialStock:0,reserved:0,sold:0,img:''};
    });
  }
  function bodyHtml(){
    const d=locked?'disabled':'';
    const specRows=draft.specs.map((s,i)=>`
      <div class="spec-row" data-si="${i}">
        <div class="field k"><label>規格名</label><input type="text" data-sf="name" value="${esc(s.name)}" placeholder="ex:尺寸" ${d}></div>
        <div class="field v"><label>選項</label><input type="text" data-sf="options" value="${esc((s.options||[]).join(', '))}" placeholder="ex:S,M,L" ${d}></div>
        ${locked?'':`<button class="btn btn--danger btn--sm spec-row__del" data-sdel="${i}" aria-label="刪除">✕</button>`}
      </div>`).join('');

    let stockBlock;
    if(draft.specs.length){
      buildVariants();
      stockBlock=`<div class="field"><label>各規格庫存</label>
        <div class="vtable">
          <div class="vrow"><span class="vn hh">規格</span><span class="hh w">現有</span><span class="hh w">初始</span><span class="hh w">預留</span></div>
          ${draft.variants.map(v=>`<div class="vrow" data-vid="${v.id}">
            <span class="vn">${esc(v.key)}</span>
            <input type="number" min="0" data-vf="stock" value="${v.stock}">
            <input type="number" min="0" data-vf="initialStock" value="${v.initialStock}" ${locked?'disabled':''}>
            <input type="number" min="0" data-vf="reserved" value="${v.reserved||0}">
          </div>`).join('')}
        </div>
        <div class="hint">預留的數量算在庫存內；收銀時預設不會賣到預留的量，需在加入購物車時特別勾選才能動用。</div>
        </div>
        <div class="field"><label>各規格圖片（選填）</label><div class="vimg-list">
          ${draft.variants.map(v=>`<div class="vimg">
            ${v.img?`<img src="${v.img}" alt="">`:`<span class="ph">🏷️</span>`}
            <button class="btn btn--sm" data-vimg="${v.id}">${v.img?'更換':'上傳'}</button>
            <span style="font-size:12px;color:var(--muted)">${esc(v.key)}</span>
          </div>`).join('')}
        </div></div>`;
    }else{
      stockBlock=`<div class="field-row">
        <div class="field"><label>庫存（現有）</label><input type="number" min="0" id="pstock" value="${draft.stock}"></div>
        <div class="field"><label>初始庫存</label><input type="number" min="0" id="pinit" value="${draft.initialStock}" ${d}></div>
      </div>
      <div class="field"><label>預留（選填）</label><input type="number" min="0" id="preserve" value="${draft.reserved||0}"></div>
      <div class="hint">預留的數量算在庫存內；收銀時預設不會賣到預留的量，需在加入購物車時特別勾選才能動用。</div>`;
    }
    return `${locked?`<div class="lock-note">此商品已有交易紀錄，僅能調整價格、庫存與圖片；品名與規格已鎖定，以保護既有訂單。</div>`:''}
      <div class="field"><label>品名</label><input type="text" id="pname" value="${esc(draft.name)}" placeholder="商品名稱" maxlength="40" ${d}></div>
      <div class="field"><label>商品主圖（選填）</label>
        <button type="button" class="img-drop" id="pimgBtn">
          ${draft.image?`<img src="${draft.image}" alt="">`:`<span class="ph">📷</span>`}
          <span>${draft.image?'點擊更換圖片':'點擊選擇圖片'}</span>
        </button>
      </div>
      <div class="field"><label>價格</label><input type="number" min="0" step="0.01" id="pprice" value="${draft.price}"></div>
      <div class="field"><label>提醒（選填）</label><input type="text" id="preminder" value="${esc(draft.reminder||'')}" placeholder="例如：售出時提醒客人先確認尺寸" maxlength="60">
        <div class="hint">結帳時若購物車內含此商品，確認收款前會先跳出這則提醒。</div>
      </div>
      <div class="field"><label>自訂規格（選填，例如尺寸、顏色）</label>${specRows}
        ${locked?'':`<button class="btn btn--sm" id="addspec">＋ 新增規格</button>`}
        ${draft.specs.length?'<div class="hint">有規格時，庫存與圖片依各規格分開設定。</div>':''}
      </div>
      ${stockBlock}
      <div class="err" id="perr"></div>`;
  }
  function collect(){
    draft.name=$('#pname',modal).value.trim();
    draft.price=parseFloat($('#pprice',modal).value)||0;
    const pmr=$('#preminder',modal); if(pmr) draft.reminder=pmr.value.trim();
    $$('.spec-row',modal).forEach(row=>{
      const i=+row.dataset.si;
      draft.specs[i].name=$('[data-sf="name"]',row).value.trim();
      draft.specs[i].options=$('[data-sf="options"]',row).value.split(',').map(x=>x.trim()).filter(Boolean);
    });
    if(draft.specs.length){
      buildVariants();
      $$('.vrow[data-vid]',modal).forEach(r=>{
        const v=draft.variants.find(x=>x.id===r.dataset.vid); if(!v) return;
        v.stock=Math.max(0,parseInt($('[data-vf="stock"]',r).value)||0);
        const ii=$('[data-vf="initialStock"]',r); if(ii) v.initialStock=Math.max(0,parseInt(ii.value)||0);
        const rr=$('[data-vf="reserved"]',r); v.reserved=rr?Math.max(0,parseInt(rr.value)||0):0;
      });
    }else{
      draft.stock=Math.max(0,parseInt($('#pstock',modal).value)||0);
      const pi=$('#pinit',modal); if(pi) draft.initialStock=Math.max(0,parseInt(pi.value)||0);
      const pr=$('#preserve',modal); draft.reserved=pr?Math.max(0,parseInt(pr.value)||0):0;
    }
  }
  function rebuild(){ collect(); $('.m-body',modal).innerHTML=bodyHtml(); wire(false); }
  function wire(focus){
    if(focus && !locked) $('#pname',modal).focus();
    const as=$('#addspec',modal);
    if(as) as.onclick=()=>{ collect(); draft.specs.push({id:uid(),name:'',options:[]}); $('.m-body',modal).innerHTML=bodyHtml(); wire(false); };
    $$('[data-sdel]',modal).forEach(b=>b.onclick=()=>{ collect(); draft.specs.splice(+b.dataset.sdel,1); $('.m-body',modal).innerHTML=bodyHtml(); wire(false); });
    $$('.spec-row [data-sf]',modal).forEach(inp=>inp.addEventListener('change',rebuild));
    const ps=$('#pstock',modal), pin=$('#pinit',modal);
    if(ps&&pin&&!locked){ ps.addEventListener('input',()=>{ if(!pin.dataset.t) pin.value=ps.value; }); pin.addEventListener('input',()=>pin.dataset.t='1'); }
    $$('.vrow [data-vf="stock"]',modal).forEach(inp=>inp.addEventListener('input',()=>{
      const ii=inp.parentElement.querySelector('[data-vf="initialStock"]');
      if(ii && !ii.disabled && !ii.dataset.t) ii.value=inp.value;
    }));
    $$('.vrow [data-vf="initialStock"]',modal).forEach(inp=>inp.addEventListener('input',()=>inp.dataset.t='1'));
    const pimgBtn=$('#pimgBtn',modal);
    if(pimgBtn) pimgBtn.onclick=()=>pickImage(dd=>{ collect(); draft.image=dd; $('.m-body',modal).innerHTML=bodyHtml(); wire(false); });
    $$('[data-vimg]',modal).forEach(b=>b.onclick=()=>pickImage(dd=>{
      collect(); const v=draft.variants.find(x=>x.id===b.dataset.vimg); if(v) v.img=dd;
      $('.m-body',modal).innerHTML=bodyHtml(); wire(false);
    }));
  }
  shell(existing?'修改商品':'新增商品', bodyHtml(),
    `<button class="btn" data-x2>取消</button><button class="btn btn--primary" id="psave">儲存</button>`);
  $('[data-x2]',modal).onclick=closeModal;
  wire(true);
  $('#psave',modal).onclick=async()=>{
    collect();
    const err=$('#perr',modal);
    if(!draft.name){ err.textContent='請輸入品名'; err.classList.add('show'); return; }
    if(draft.specs.some(s=>!s.name||!s.options.length)){ err.textContent='每個規格都需要名稱與至少一個選項'; err.classList.add('show'); return; }
    if(existing && (productLocked(existing) || st.orders.some(o=>o.lines.some(l=>l.productId===existing.id||(l.productIds&&l.productIds.includes(existing.id)))))){
      if(!await confirmDialog('此商品已有交易紀錄。修改不會影響既有訂單，確定儲存變更？','確定儲存','primary')) return;
    }
    if(draft.specs.length){ delete draft.stock; delete draft.initialStock; delete draft.reserved; delete draft.sold; }
    else draft.variants=[];
    const arr=st.products, idx=arr.findIndex(p=>p.id===draft.id);
    if(idx>=0) arr[idx]=draft; else arr.push(draft);
    save(); closeModal(); render();
    /* 線上攤位：把目錄推上雲端；這個商品的庫存是使用者剛剛明確設定的，用 stockSet 覆蓋伺服器值 */
    if(isOnlineStall(st)){
      const stockSet={};
      if(draft.specs.length) (draft.variants||[]).forEach(v=>{ stockSet[v.id]=v.stock||0; });
      else stockSet[draft.id]=draft.stock||0;
      pushCatalog(st,stockSet);
    }
  };
}

/* ----- bundle create / edit ----- */
function openBundleModal(st,existing){
  const locked = existing && bundleLocked(existing);
  const draft = existing ? JSON.parse(JSON.stringify(existing)) : {id:uid(),name:'',price:0,image:'',components:[]};
  const qmap={}; draft.components.forEach(c=>qmap[c.productId]=c.qty);
  function bodyHtml(){
    return `${locked?`<div class="lock-note">此套組已有交易紀錄，僅能調整售價；組成內容已鎖定。</div>`:''}
      <div class="field"><label>套組封面圖（選填）</label>
        <button type="button" class="img-drop" id="bimgBtn">
          ${draft.image?`<img src="${draft.image}" alt="">`:`<span class="ph">🎁</span>`}
          <span>${draft.image?'點擊更換圖片':'點擊選擇圖片'}</span>
        </button>
      </div>
      <div class="field"><label>套組名稱</label><input type="text" id="bname" value="${esc(draft.name)}" placeholder="例如：耳環＋貼紙優惠組" maxlength="40" ${locked?'disabled':''}></div>
      <div class="field"><label>套組售價</label><input type="number" min="0" step="0.01" id="bprice" value="${draft.price}"></div>
      <div class="field"><label>選擇組成商品與數量</label>
        ${st.products.map(p=>`<div class="comp-row" data-pid="${p.id}">
          <div class="comp-row__nm">${esc(p.name)}<small>${money(p.price)}${hasSpec(p)?' · 規格於收銀時選':''}</small></div>
          <input type="number" min="0" data-cf="qty" value="${qmap[p.id]||0}" placeholder="0" ${locked?'disabled':''}>
        </div>`).join('')}
        <div class="hint">數量填 0 代表不含此商品。套組不設庫存，售出時扣除組成商品的庫存。</div>
      </div>
      <div class="err" id="berr"></div>`;
  }
  function collect(){
    draft.name=$('#bname',modal).value.trim();
    draft.price=parseFloat($('#bprice',modal).value)||0;
    if(!locked){
      draft.components=[];
      $$('.comp-row',modal).forEach(row=>{
        const q=Math.max(0,parseInt($('[data-cf="qty"]',row).value)||0);
        if(q>0) draft.components.push({productId:row.dataset.pid,qty:q});
      });
    }
  }
  function wire(){
    const bimgBtn=$('#bimgBtn',modal);
    if(bimgBtn) bimgBtn.onclick=()=>pickImage(dd=>{ collect(); draft.image=dd; $('.m-body',modal).innerHTML=bodyHtml(); wire(); });
  }
  shell(existing?'修改套組':'新增套組',bodyHtml(),
    `<button class="btn" data-x2>取消</button><button class="btn btn--primary" id="bsave">儲存</button>`);
  $('[data-x2]',modal).onclick=closeModal;
  $('#bname',modal).focus();
  wire();
  $('#bsave',modal).onclick=async()=>{
    collect();
    const err=$('#berr',modal);
    if(!draft.name){ err.textContent='請輸入套組名稱'; err.classList.add('show'); return; }
    if(!draft.components.length){ err.textContent='請至少選擇一個商品（數量大於 0）'; err.classList.add('show'); return; }
    if(existing && bundleLocked(existing)){
      if(!await confirmDialog('此套組已有交易紀錄。修改不會影響既有訂單，確定儲存？','確定儲存','primary')) return;
    }
    const arr=st.bundles, idx=arr.findIndex(b=>b.id===draft.id);
    if(idx>=0) arr[idx]=draft; else arr.push(draft);
    save(); closeModal(); render();
    if(isOnlineStall(st)) pushCatalog(st);
  };
}

/* ----- add-to-cart sheet ----- */
function openAddSheet(st,kind,id){
  const isP = kind==='product';
  const p = isP ? product(st,id) : null;
  const b = isP ? null : bundle(st,id);
  // selection state
  let sel = {};   // product: {specId:option}   bundle: {compIndex:variantId}
  let qty = 1;
  let useReserved = false;   // products only: allow this add to dip into the reserved pool
  if(isP && hasSpec(p)) p.specs.forEach(s=>sel[s.id]=s.options[0]);
  if(!isP){
    bundleComps(st,b).forEach((c,i)=>{
      if(c.needsSpec){ const f=c.product.variants[0]?.id; sel[i]=Array.from({length:c.qty},()=>f); }
    });
  }

  function resolvedPvP(){ // product variant id (or product id)
    if(!hasSpec(p)) return p.id;
    const v=variantByCombo(p,sel); return v?v.id:null;
  }
  function maxQty(){
    if(isP){ const pv=resolvedPvP(); return pv?Math.max(0,pvRemaining(st,pv,null,useReserved)):0; }
    return Math.max(0,bundleMaxBuild(st,b,sel));
  }
  function bodyHtml(){
    const mq=maxQty();
    if(qty>mq) qty=Math.max(mq>0?1:0,mq);
    if(qty<1 && mq>0) qty=1;
    let hero, groups='';
    if(isP){
      const pv=resolvedPvP();
      const v=hasSpec(p)?p.variants.find(x=>x.id===pv):null;
      const img=(v&&v.img)||p.image||'';
      const resv=pv?pvReserved(st,pv):0;
      const remNo=pv?Math.max(0,pvRemaining(st,pv,null,false)):0;
      let stLine;
      if(resv<=0) stLine = mq>0?`可加入 ${mq} 件`:'此規格庫存不足';
      else if(useReserved) stLine = mq>0?`可加入 ${mq} 件（含預留）`:'庫存不足（含預留）';
      else stLine = remNo>0?`可加入 ${mq} 件（一般庫存）`:`一般庫存已無，僅剩預留庫存`;
      hero=`<div class="sheet-hero">${img?`<img src="${img}" alt="">`:`<span class="ph">🏷️</span>`}
        <div><div class="nm">${esc(p.name)}</div><div class="pr money">${money(p.price)}</div>
        <div class="st">${stLine}</div></div></div>`;
      if(hasSpec(p)) groups=p.specs.map(s=>`<div class="sel-group"><label>${esc(s.name)}</label>
        <select data-sg="${s.id}">${s.options.map(o=>{
          const test={...sel,[s.id]:o}; const vv=variantByCombo(p,test);
          const rem=vv?pvRemaining(st,vv.id,null,useReserved):0;
          return `<option value="${esc(o)}" ${sel[s.id]===o?'selected':''} ${rem<=0?'disabled':''}>${esc(o)}${rem<=0?'（售罄）':''}</option>`;
        }).join('')}</select></div>`).join('');
      if(resv>0) groups += `<label class="reserve-toggle"><input type="checkbox" id="useResChk" ${useReserved?'checked':''}>
        <span>使用預留庫存（尚有 ${resv} 件預留）</span></label>`;
    }else{
      const comps=bundleComps(st,b);
      hero=`<div class="sheet-hero">${b.image?`<img src="${b.image}" alt="">`:`<span class="ph">🎁</span>`}
        <div><div class="nm">${esc(b.name)}</div><div class="pr money">${money(b.price)}</div>
        <div class="st">${comps.map(c=>(c.missing?'(缺)':c.product.name)+'×'+c.qty).join('、')}</div>
        <div class="st">${mq>0?`可組 ${mq} 份`:'組成商品庫存不足'}</div></div></div>`;
      groups=comps.map((c,i)=>{
        if(!c.needsSpec) return '';
        const arr=Array.isArray(sel[i])?sel[i]:[];
        return `<div class="sel-group"><label>${esc(c.product.name)}${c.qty>1?` — 分別選 ${c.qty} 件的規格`:' 的規格'}</label>
          ${arr.map((cur,j)=>`<select data-bg="${i}" data-bj="${j}" style="margin-bottom:6px">${c.product.variants.map(v=>{
            const rem=pvRemaining(st,v.id);
            return `<option value="${v.id}" ${cur===v.id?'selected':''} ${rem<=0?'disabled':''}>${esc(v.key)}${rem<=0?'（售罄）':''}</option>`;
          }).join('')}</select>`).join('')}
        </div>`;
      }).join('');
    }
    return `${hero}${groups}
      <div class="qty-pick"><span class="label">數量</span>
        <div class="stepper">
          <button data-q="-1" ${qty<=1?'disabled':''}>−</button><span class="q">${qty}</span>
          <button data-q="1" ${qty>=mq?'disabled':''}>＋</button>
        </div>
      </div>`;
  }
  function wire(){
    $$('[data-sg]',modal).forEach(se=>se.onchange=()=>{ sel[se.dataset.sg]=se.value; refresh(); });
    $$('[data-bg]',modal).forEach(se=>se.onchange=()=>{
      const i=+se.dataset.bg, j=+se.dataset.bj;
      if(!Array.isArray(sel[i])) sel[i]=[];
      sel[i][j]=se.value; refresh();
    });
    $$('[data-q]',modal).forEach(bn=>bn.onclick=()=>{ qty=Math.max(0,qty+ +bn.dataset.q); refresh(); });
    const rc=$('#useResChk',modal);
    if(rc) rc.onchange=()=>{ useReserved=rc.checked; refresh(); };
  }
  function refresh(){ $('.m-body',modal).innerHTML=bodyHtml(); wire(); updateFoot(); }
  function updateFoot(){ const mq=maxQty(); $('#addBtn',modal).disabled = mq<=0 || qty<=0; }

  shell(isP?'加入購物車':'加入購物車（套組）', bodyHtml(),
    `<button class="btn" data-x2>取消</button><button class="btn btn--primary" id="addBtn">加入購物車</button>`);
  $('[data-x2]',modal).onclick=closeModal;
  wire(); updateFoot();
  $('#addBtn',modal).onclick=()=>{
    const mq=maxQty(); if(mq<=0||qty<=0) return;
    if(isP){
      const pv=resolvedPvP(); if(!pv) return;
      const ex=UI.cart.find(l=>l.kind==='product'&&l.pvId===pv&&!!l.useReserved===useReserved);
      if(ex) ex.qty=Math.min(ex.qty+qty, ex.qty+pvRemaining(st,pv,null,useReserved));
      else UI.cart.push({uid:uid(),kind:'product',pvId:pv,qty,useReserved});
    }else{
      const picks={}; bundleComps(st,b).forEach((c,i)=>{ if(c.needsSpec) picks[i]=(sel[i]||[]).slice(); });
      const ex=UI.cart.find(l=>l.kind==='bundle'&&l.bundleId===b.id&&JSON.stringify(l.picks)===JSON.stringify(picks));
      if(ex) ex.qty+=qty; else UI.cart.push({uid:uid(),kind:'bundle',bundleId:b.id,picks,qty});
    }
    closeModal(); renderCheckout(st,$('#body'));
  };
}

/* ---------- toast ---------- */
let toastT;
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,2600); }

/* ============================================================ SEED (first run) ============================================================ */
function seed(){
  const st={id:uid(),name:'夜市手作飾品攤（範例資料）',createdAt:Date.now()-86400000*2,vendDate:fmtDate(Date.now()-86400000*2),cover:'',products:[],bundles:[],orders:[],income:0};
  const earring={id:uid(),name:'手工耳環',image:'',price:180,reminder:'提醒客人耳環為手工製作，材質怕水怕汗',specs:[],stock:24,initialStock:24,sold:0,variants:[]};
  const sticker={id:uid(),name:'貼紙包',image:'',price:50,specs:[],stock:40,initialStock:40,sold:0,variants:[]};
  const sid=uid();
  const bag={id:uid(),name:'棉麻托特包',image:'',price:420,
    specs:[{id:sid,name:'顏色',options:['米白','墨綠']}],
    stock:0,initialStock:0,sold:0,
    variants:[
      {id:uid(),key:'米白',combo:{[sid]:'米白'},stock:8,initialStock:8,sold:0,img:''},
      {id:uid(),key:'墨綠',combo:{[sid]:'墨綠'},stock:6,initialStock:6,sold:0,img:''},
    ]};
  delete bag.stock; delete bag.initialStock; delete bag.sold;
  st.products.push(earring,bag,sticker);
  const combo={id:uid(),name:'耳環＋貼紙 優惠組',price:200,components:[{productId:earring.id,qty:1},{productId:sticker.id,qty:1}]};
  st.bundles.push(combo);
  DB.stalls.push(st); UI.stallId=st.id;

  const runs=[
    [{kind:'product',pvId:earring.id,qty:2},{kind:'product',pvId:sticker.id,qty:1}],
    [{kind:'bundle',bundleId:combo.id,picks:{},qty:1}],
    [{kind:'product',pvId:bag.variants[1].id,qty:1},{kind:'product',pvId:earring.id,qty:1}],
  ];
  runs.forEach((lines,i)=>{ UI.cart=lines.map(l=>({uid:uid(),...l})); const o=applyPayment(st,false); o.time=Date.now()-(runs.length-i)*3600000*2; });
  UI.cart=[]; UI.stallId=null;
  save();
}

/* 後端網址寫死在 backend-url.txt，開啟時讀進來（檔案優先，沒有才用設定裡手填的） */
(async function loadBackendUrl(){
  try{
    const r=await fetch('backend-url.txt?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) return;
    const txt=await r.text();
    const line=txt.split(/\r?\n/).map(s=>s.trim())
      .find(s=>s && !s.startsWith('#') && /^https?:\/\//i.test(s));
    if(line){
      DB.settings.gasUrlFromFile=line;
      DB.settings.gasUrl=line;
      save();
    }
  }catch(err){/* 檔案不存在或離線就沿用設定裡的值 */}
})();

if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
